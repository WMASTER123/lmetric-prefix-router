[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lmetric-prefix-router"
version = "0.1.0.dev5"
description = "Prefix-aware replica placement for local vLLM serving"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
native023 = ["msgspec>=0.18,<1", "pyzmq>=25,<28", "psutil>=6,<8"]
test = ["msgspec>=0.18,<1", "pyzmq>=25,<28", "pytest>=8", "ruff>=0.12", "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@a39e78ca5d2b36bd09b878a1b6f48a6e61d9302d"]

[tool.hatch.metadata]
allow-direct-references = true

[project.entry-points."vllm_hust.extension_bundles"]
"io.github.wmaster123.lmetric-prefix-router" = "lmetric_prefix_router"

[project.entry-points."vllm_hust_ext.providers"]
lmetric-prefix-router = "lmetric_prefix_router.provider:RouterProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/lmetric_prefix_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
